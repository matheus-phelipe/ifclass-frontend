<div class="profile-switcher" *ngIf="availableRoles.length > 1">
  <div class="profile-card">
    <div class="profile-info">
      <div class="profile-avatar">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="profile-details">
        <div class="profile-name">{{ nomeUsuario }}</div>
        <div class="profile-role">
          <i class="bi bi-eye"></i>
          Visão: {{ formatRoleName(activeRole!) }}
        </div>
      </div>
    </div>
    <div class="profile-actions">
      <button class="btn btn-sm btn-outline-primary" (click)="toggleDropdown()">
        <i class="bi bi-chevron-down"></i>
      </button>
    </div>
  </div>
  
  <div class="profile-dropdown" [class.show]="dropdownOpen">
    <div class="dropdown-header">
      <i class="bi bi-people"></i>
      Trocar Perfil
    </div>
    <div class="dropdown-items">
      <div *ngFor="let role of availableRoles" 
           class="dropdown-item" 
           [class.active]="role === activeRole"
           (click)="switchProfile(role)">
        <div class="item-icon">
          <i [ngClass]="getRoleIcon(role)"></i>
        </div>
        <div class="item-text">
          <div class="item-title">{{ formatRoleName(role) }}</div>
          <div class="item-description">{{ getRoleDescription(role) }}</div>
        </div>
        <div class="item-check" *ngIf="role === activeRole">
          <i class="bi bi-check-circle-fill"></i>
        </div>
      </div>
    </div>
  </div>
</div>
